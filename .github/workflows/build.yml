name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GreekSwitch.sln

      - name: Build
        run: dotnet build GreekSwitch.sln -c Release --no-restore

      - name: Test
        run: dotnet test GreekSwitch.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Evaluation report
        shell: pwsh
        run: |
          dotnet test tests/GreekSwitch.Evaluation -c Release --no-build --filter "FullyQualifiedName~EvaluationTests" --logger "console;verbosity=detailed"
          Get-Content tests/GreekSwitch.Evaluation/bin/Release/net8.0/evaluation-report.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish single-file exes (win-x64, win-arm64)
        shell: pwsh
        run: |
          foreach ($rid in "win-x64", "win-arm64") {
            dotnet publish src/GreekSwitch.App -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -o publish/$rid
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Placeholder: code signing. Store the certificate as a secret and sign both exes here, e.g.
      #   signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f cert.pfx /p ${{ secrets.CERT_PASSWORD }} publish/win-x64/GreekSwitch.exe publish/win-arm64/GreekSwitch.exe
      - name: Sign executables (placeholder)
        run: echo "Code signing not configured; publish/win-x64/GreekSwitch.exe and publish/win-arm64/GreekSwitch.exe are unsigned."

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          foreach ($rid in "win-x64", "win-arm64") {
            $hash = (Get-FileHash publish/$rid/GreekSwitch.exe -Algorithm SHA256).Hash
            Set-Content -Path publish/$rid/GreekSwitch.exe.sha256 -Value "$hash  GreekSwitch.exe" -Encoding ascii
            "SHA-256 ($rid): $hash" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload GreekSwitch.exe (win-x64)
        uses: actions/upload-artifact@v4
        with:
          name: GreekSwitch-win-x64
          path: |
            publish/win-x64/GreekSwitch.exe
            publish/win-x64/GreekSwitch.exe.sha256
          if-no-files-found: error

      - name: Upload GreekSwitch.exe (win-arm64)
        uses: actions/upload-artifact@v4
        with:
          name: GreekSwitch-win-arm64
          path: |
            publish/win-arm64/GreekSwitch.exe
            publish/win-arm64/GreekSwitch.exe.sha256
          if-no-files-found: error
